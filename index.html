<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vérification de carte</title>
<style>
  :root{
    --bg:#f5f5f2; --card:#ffffff; --text:#1d1d1b; --muted:#6b6b66; --line:#e4e3de;
    --ok:#1f7a4d; --ok-bg:#e6f4ec; --warn:#9a6200; --warn-bg:#fdf3e1;
    --bad:#b3261e; --bad-bg:#fbe9e7; --info:#3a5a8c; --info-bg:#e9eef7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141413; --card:#1e1e1c; --text:#f0efe9; --muted:#a3a29b; --line:#33322e;
      --ok:#5fd39a; --ok-bg:#16301f; --warn:#f0b65a; --warn-bg:#33270f;
      --bad:#ff8a80; --bad-bg:#3a1714; --info:#9bb7e8; --info-bg:#1a2333;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  main{width:100%;max-width:420px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:32px 24px;text-align:center}
  .badge{width:88px;height:88px;border-radius:50%;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--info)}
  .badge svg{width:44px;height:44px}
  h1{font-size:1.5rem;line-height:1.25;margin:0 0 8px}
  p.msg{color:var(--muted);margin:0 0 20px}
  .serial{font:600 1.25rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
    padding:12px 16px;border-radius:12px;background:var(--bg);margin:0 0 20px;word-break:break-all}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;margin:0;
    font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
  dt{font-weight:600;color:var(--text)} dd{margin:0;text-align:right}
  .test{display:inline-block;margin-bottom:16px;padding:4px 10px;border-radius:999px;
    font-size:.8rem;font-weight:600;background:var(--warn-bg);color:var(--warn)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}
  .ok .badge{background:var(--ok-bg);color:var(--ok)} .ok h1{color:var(--ok)}
  .warn .badge{background:var(--warn-bg);color:var(--warn)}
  .bad .badge{background:var(--bad-bg);color:var(--bad)} .bad h1{color:var(--bad)}
  .spin{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <span class="test" id="test" hidden>Mode test : clés d'usine</span>
    <div class="badge" id="badge"></div>
    <h1 id="title">Vérification en cours…</h1>
    <p class="msg" id="msg">Contrôle de la signature cryptographique de la carte.</p>
    <div class="serial" id="serial" hidden></div>
    <dl id="details" hidden>
      <dt>Lecture n°</dt><dd id="counter">–</dd>
      <dt>Vérifications réussies</dt><dd id="scans">–</dd>
      <dt>Contrôlé le</dt><dd id="when">–</dd>
    </dl>
  </div>
  <footer>Carte NFC sécurisée NTAG 424 DNA</footer>
</main>

<script>
  // ⚙️ Adresse de l'Edge Function Supabase
  const VERIFY_URL = "https://zatvtgyymxvtlshrulzj.supabase.co/functions/v1/verify";

  const ICONS = {
    load: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>',
    ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    bad:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
  };

  const VIEWS = {
    authentic:       ["ok",   "Carte authentique"],
    replay:          ["warn", "Lien déjà utilisé"],
    unknown:         ["warn", "Carte non enregistrée"],
    invalid:         ["bad",  "Carte non authentique"],
    serial_mismatch: ["bad",  "Numéro de série incorrect"],
    revoked:         ["bad",  "Carte révoquée"],
    bad_request:     ["info", "Lien incomplet"],
    error:           ["info", "Service indisponible"]
  };

  const $ = (id) => document.getElementById(id);

  function show(kind, title, msg) {
    $("card").className = "card " + kind;
    $("badge").innerHTML = ICONS[kind] || ICONS.info;
    $("title").textContent = title;
    $("msg").textContent = msg;
  }

  async function run() {
    const q = new URLSearchParams(location.search);
    if (!q.get("cmac")) {
      show("info", "Vérification de carte",
           "Approchez une carte NFC de votre téléphone pour vérifier son authenticité.");
      return;
    }
    show("load", "Vérification en cours…", "Contrôle de la signature cryptographique de la carte.");
    $("badge").innerHTML = ICONS.load;

    // Retire les paramètres de la barre d'adresse : un rechargement ne réutilise pas le lien
    history.replaceState(null, "", location.pathname);

    let data;
    try {
      const r = await fetch(VERIFY_URL + "?" + q.toString(), { cache: "no-store" });
      data = await r.json();
    } catch (e) {
      data = { status: "error", message: "Impossible de joindre le service de vérification." };
    }

    const [kind, title] = VIEWS[data.status] || VIEWS.error;
    show(kind, title, data.message || "");
    $("test").hidden = !data.test_mode;

    const serial = data.serial || q.get("sn");
    // n'affiche le n° de série que s'il est confirmé par le serveur (jamais pour une carte refusée)
    if (serial && (kind === "ok" || kind === "warn") && data.serial) {
      $("serial").textContent = serial;
      $("serial").hidden = false;
    }
    if (data.status === "authentic") {
      $("counter").textContent = data.counter ?? "–";
      $("scans").textContent = data.scans ?? "–";
      $("when").textContent = new Date().toLocaleString("fr-CH");
      $("details").hidden = false;
    }
  }

  run();
</script>
</body>
</html>
